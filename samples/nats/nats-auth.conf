# NATS server configuration for running the samples with authenticated NATS, see samples/README.md.
#
# Every component has its own user, which may only publish to the subjects it needs. The permissions are those of
# docs/developer/nats/least-privilege.conf for the Provision Manager, one agent and one manager in the namespace
# "default", with the names of the samples:
#   - stream "cfm-stream" and key-value bucket "cfm-bucket"
#   - the sample agent for the activity type "sample-storage"
#   - the sample manager
# The passwords are placeholders for local use. Prefer NKeys or JWT credentials in production.

jetstream {
  store_dir: "/tmp/jetstream"
}

authorization {

  # Provision Manager: consumes the orchestration manifests of every namespace, owns the orchestration state and enqueues
  # the first activities.
  PMANAGER = {
    publish = {
      allow = [
        "event.>"
        "$KV.cfm-bucket.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.~cfm-orchestration.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.~cfm-orchestration"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.~cfm-orchestration"
        "$JS.ACK.cfm-stream.~cfm-orchestration.>"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.KV_cfm-bucket.pmanager-index-watcher.>"
        "$JS.API.CONSUMER.INFO.KV_cfm-bucket.pmanager-index-watcher"
        "$JS.API.CONSUMER.MSG.NEXT.KV_cfm-bucket.pmanager-index-watcher"
        "$JS.ACK.KV_cfm-bucket.pmanager-index-watcher.>"
      ]
      # Only the managers start orchestrations
      deny = ["event.*.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Sample agent: executes the activities of the type "sample-storage" in the namespace "default", updates the state of
  # the orchestrations of its namespace and publishes the orchestration response when it completes the last activity.
  SAMPLE_AGENT = {
    publish = {
      allow = [
        "event.default.>"
        "$KV.cfm-bucket.default.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.$KV.cfm-bucket.default.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.default~sample-storage.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.default~sample-storage"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.default~sample-storage"
        "$JS.ACK.cfm-stream.default~sample-storage.>"
      ]
      deny = ["event.default.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Sample manager: starts orchestrations in the namespace "default" and consumes their responses. It cannot publish
  # activity messages or responses, and cannot write orchestration state.
  SAMPLE_MANAGER = {
    publish = {
      allow = [
        "event.default.cfm-orchestration"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-stream.default~cfm-orchestration-response.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.default~cfm-orchestration-response"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.default~cfm-orchestration-response"
        "$JS.ACK.cfm-stream.default~cfm-orchestration-response.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  users = [
    { user: "pmanager", password: "pmanager-secret", permissions: $PMANAGER }
    { user: "sample-agent", password: "sample-agent-secret", permissions: $SAMPLE_AGENT }
    { user: "sample-manager", password: "sample-manager-secret", permissions: $SAMPLE_MANAGER }
  ]
}
