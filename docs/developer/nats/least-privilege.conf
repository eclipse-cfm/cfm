# Least-privilege NATS authorization for CFM components.
#
# This block is a starting point for a NATS server configuration. It gives every CFM component its own user that may
# only publish and subscribe to the subjects the component needs. See README.md in this directory for the rationale and
# for how to adapt it.
#
# The block assumes the defaults used throughout CFM:
#   - JetStream stream "cfm-stream" for orchestration messages (<prefix>_STREAM)
#   - JetStream key-value bucket "cfm-bucket" for orchestration state (<prefix>_BUCKET)
#   - an orchestration agent handling the activity type "test-activity"
#   - JetStream stream "cfm-events" carrying "events.keypair.>" CloudEvents, provisioned out of band
#   - the key management lifecycle agent with the agent name "keymanagement-agent"
# Replace these names, and add one agent user per activity type, to match your deployment.
#
# The passwords are placeholders. Prefer NKeys or decentralized JWT authentication in production; the permission
# blocks below can be reused unchanged for those users.

authorization {

  # Tenant Manager: starts orchestrations and consumes their responses.
  TMANAGER = {
    publish = {
      allow = [
        "event.cfm-orchestration"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.UPDATE.cfm-stream"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.STREAM.UPDATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-stream.cfm-orchestration-response.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.cfm-orchestration-response"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.cfm-orchestration-response"
        "$JS.ACK.cfm-stream.cfm-orchestration-response.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Provision Manager: consumes orchestration requests, owns orchestration state and enqueues the first activities.
  PMANAGER = {
    publish = {
      allow = [
        "event.*"
        "$KV.cfm-bucket.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.UPDATE.cfm-stream"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.STREAM.UPDATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.cfm-orchestration.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.cfm-orchestration"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.cfm-orchestration"
        "$JS.ACK.cfm-stream.cfm-orchestration.>"
      ]
      # Only the Tenant Manager starts orchestrations
      deny = ["event.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>", "$KV.cfm-bucket.>"] }
  }

  # Orchestration agent for one activity type: executes its activity, updates orchestration state, enqueues the next
  # activities and publishes the orchestration response when it completes the last one.
  TEST_ACTIVITY_AGENT = {
    publish = {
      allow = [
        "event.*"
        "$KV.cfm-bucket.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.UPDATE.cfm-stream"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.STREAM.UPDATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.test-activity.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.test-activity"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.test-activity"
        "$JS.ACK.cfm-stream.test-activity.>"
      ]
      deny = ["event.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Lifecycle agent (here the key management agent): consumes CloudEvents from the externally provisioned event stream.
  # It never writes orchestration state, but the shared client setup creates or updates the KV bucket on start.
  KEYMANAGEMENT_AGENT = {
    publish = {
      allow = [
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-events"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.STREAM.UPDATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-events.keymanagement-agent"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-events.keymanagement-agent"
        "$JS.ACK.cfm-events.keymanagement-agent.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # IdentityHub: the only publisher of key pair lifecycle events.
  IDENTITYHUB = {
    publish = { allow = ["events.keypair.>"] }
    subscribe = { allow = ["_INBOX.>"] }
  }

  users = [
    { user: "tmanager", password: "tmanager-secret", permissions: $TMANAGER }
    { user: "pmanager", password: "pmanager-secret", permissions: $PMANAGER }
    { user: "test-activity-agent", password: "test-activity-agent-secret", permissions: $TEST_ACTIVITY_AGENT }
    { user: "keymanagement-agent", password: "keymanagement-agent-secret", permissions: $KEYMANAGEMENT_AGENT }
    { user: "identityhub", password: "identityhub-secret", permissions: $IDENTITYHUB }
  ]
}
