# Least-privilege NATS authorization for CFM components.
#
# This block is a starting point for a NATS server configuration. It gives every CFM component its own user that may
# only publish and subscribe to the subjects the component needs. See README.md in this directory for the rationale and
# for how to adapt it.
#
# The block assumes the defaults used throughout CFM:
#   - JetStream stream "cfm-stream" for orchestration messages (<prefix>_STREAM)
#   - JetStream key-value bucket "cfm-bucket" for orchestration state (<prefix>_BUCKET)
#   - the Tenant Manager as the manager of the namespace "default"
#   - an orchestration agent handling the activity type "test-activity" in the namespace "default"
#   - a second manager and its agent for "test-activity" in the namespace "second", which share the Provision Manager
#   - JetStream stream "cfm-events" carrying "events.keypair.>" CloudEvents, provisioned out of band
#   - the key management lifecycle agent with the agent name "keymanagement-agent"
# Replace these names, and add one manager user per namespace and one agent user per namespace and activity type, to
# match your deployment. The subjects of a namespace are "event.<namespace>.>" and its orchestration state is stored
# under the keys "<namespace>.>" of the bucket, so the permissions below keep the namespaces apart.
#
# The passwords are placeholders. Prefer NKeys or decentralized JWT authentication in production; the permission
# blocks below can be reused unchanged for those users.

authorization {

  # Tenant Manager: the manager of the namespace "default". Starts orchestrations and consumes their responses.
  TMANAGER = {
    publish = {
      allow = [
        "event.default.cfm-orchestration"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-stream.default~cfm-orchestration-response.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.default~cfm-orchestration-response"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.default~cfm-orchestration-response"
        "$JS.ACK.cfm-stream.default~cfm-orchestration-response.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Provision Manager: consumes the orchestration requests of every namespace, owns orchestration state and enqueues the
  # first activities.
  PMANAGER = {
    publish = {
      allow = [
        "event.>"
        "$KV.cfm-bucket.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.~cfm-orchestration.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.~cfm-orchestration"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.~cfm-orchestration"
        "$JS.ACK.cfm-stream.~cfm-orchestration.>"
        # orchestration index watcher: a durable consumer on the stream backing the KV bucket, shared by all PM replicas
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.KV_cfm-bucket.pmanager-index-watcher.>"
        "$JS.API.CONSUMER.INFO.KV_cfm-bucket.pmanager-index-watcher"
        "$JS.API.CONSUMER.MSG.NEXT.KV_cfm-bucket.pmanager-index-watcher"
        "$JS.ACK.KV_cfm-bucket.pmanager-index-watcher.>"
      ]
      # Only the managers start orchestrations
      deny = ["event.*.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Orchestration agent for one activity type in the namespace "default": executes its activity, updates the state of
  # the orchestrations of its namespace, enqueues the next activities and publishes the orchestration response when it
  # completes the last one.
  TEST_ACTIVITY_AGENT = {
    publish = {
      allow = [
        "event.default.>"
        "$KV.cfm-bucket.default.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.$KV.cfm-bucket.default.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.default~test-activity.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.default~test-activity"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.default~test-activity"
        "$JS.ACK.cfm-stream.default~test-activity.>"
      ]
      deny = ["event.default.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # A second manager, of the namespace "second", that shares the Provision Manager with the Tenant Manager. It can only
  # start orchestrations in its namespace and only consume the responses of its namespace.
  SECOND_MANAGER = {
    publish = {
      allow = [
        "event.second.cfm-orchestration"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-stream.second~cfm-orchestration-response.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.second~cfm-orchestration-response"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.second~cfm-orchestration-response"
        "$JS.ACK.cfm-stream.second~cfm-orchestration-response.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Orchestration agent for "test-activity" in the namespace "second". It cannot read or write the subjects and the
  # orchestration state of the namespace "default".
  SECOND_TEST_ACTIVITY_AGENT = {
    publish = {
      allow = [
        "event.second.>"
        "$KV.cfm-bucket.second.>"
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-stream"
        "$JS.API.STREAM.CREATE.cfm-stream"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.DIRECT.GET.KV_cfm-bucket.$KV.cfm-bucket.second.>"
        "$JS.API.CONSUMER.CREATE.cfm-stream.second~test-activity.>"
        "$JS.API.CONSUMER.INFO.cfm-stream.second~test-activity"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-stream.second~test-activity"
        "$JS.ACK.cfm-stream.second~test-activity.>"
      ]
      deny = ["event.second.cfm-orchestration"]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # Lifecycle agent (here the key management agent): consumes CloudEvents from the externally provisioned event stream.
  # It never writes orchestration state, but the shared client setup looks up the KV bucket on start and creates it if
  # it is missing.
  KEYMANAGEMENT_AGENT = {
    publish = {
      allow = [
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.cfm-events"
        "$JS.API.STREAM.INFO.KV_cfm-bucket"
        "$JS.API.STREAM.CREATE.KV_cfm-bucket"
        "$JS.API.CONSUMER.CREATE.cfm-events.keymanagement-agent"
        "$JS.API.CONSUMER.MSG.NEXT.cfm-events.keymanagement-agent"
        "$JS.ACK.cfm-events.keymanagement-agent.>"
      ]
    }
    subscribe = { allow = ["_INBOX.>"] }
  }

  # IdentityHub: the only publisher of key pair lifecycle events.
  IDENTITYHUB = {
    publish = { allow = ["events.keypair.>"] }
    subscribe = { allow = ["_INBOX.>"] }
  }

  users = [
    { user: "tmanager", password: "tmanager-secret", permissions: $TMANAGER }
    { user: "pmanager", password: "pmanager-secret", permissions: $PMANAGER }
    { user: "test-activity-agent", password: "test-activity-agent-secret", permissions: $TEST_ACTIVITY_AGENT }
    { user: "second-manager", password: "second-manager-secret", permissions: $SECOND_MANAGER }
    { user: "second-test-activity-agent", password: "second-test-activity-agent-secret", permissions: $SECOND_TEST_ACTIVITY_AGENT }
    { user: "keymanagement-agent", password: "keymanagement-agent-secret", permissions: $KEYMANAGEMENT_AGENT }
    { user: "identityhub", password: "identityhub-secret", permissions: $IDENTITYHUB }
  ]
}
