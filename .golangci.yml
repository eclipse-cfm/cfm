version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # The engine (pmanager, common, assembly, e2e) is generic. The dataspace components (Tenant Manager, agents and
        # dataspace model) live in github.com/eclipse-cfm/cfm-dataspace and build on the engine, never the other way round.
        engine-is-generic:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/eclipse-cfm/cfm-dataspace
              desc: the engine must not depend on the dataspace components
