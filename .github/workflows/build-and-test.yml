name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: "Run golangci-lint"
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
      
      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: "Generate Mocks"
        run: make generate-mocks

      - name: "Run tests"
        run: make test TEST_FORMAT=github-actions
        env:
          OTEL_SDK_DISABLED: "true"
